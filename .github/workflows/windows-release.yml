name: Windows studio release
on:
  push:
    branches: [codex/windows-studio]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --prefix .qa --no-package-lock playwright@1.62.1
      - run: npx --prefix .qa playwright install --with-deps chromium
      - name: Browser smoke
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/openslides-vite.log 2>&1 &
          for attempt in {1..30}; do curl --silent --fail http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-check
          path: studio-*.png
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:install
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application launches
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'release/win-unpacked/OpenSlides.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Desktop smoke test failed with exit code $($app.ExitCode)" }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSlides-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Create hackathon prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.1-hackathon-${{ github.run_number }}"
          gh release create $tag release/*.exe release/SHA256SUMS.txt --target '${{ github.sha }}' --title 'OpenSlides 0.2.1 — Windows hackathon build' --notes-file RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
